[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimamori"
version = "0.1.0"
description = "Night-routine monitoring daemon for Raspberry Pi 4"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "PyYAML",
    "line-bot-sdk",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
