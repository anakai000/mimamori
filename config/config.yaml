regions_file: config/regions.yaml

camera:
  # Matches the 1296x972 @ 46.34fps mode of the OV5647 sensor (see SPEC.md),
  # but fps below caps the sensor/ISP's own capture rate well under that mode's
  # native rate to save power - a night-routine use case (especially with
  # elderly, slow-moving subjects) doesn't need more than 1fps.
  size: [1296, 972]
  fps: 1.0

detection:
  model_prototxt: models/MobileNetSSD_deploy.prototxt
  model_weights: models/MobileNetSSD_deploy.caffemodel
  confidence_threshold: 0.5
  # How often (seconds) to pull a frame and run detection. Should match
  # camera.fps (1/fps) - no point polling faster than the camera actually
  # produces new frames, or slower and missing ones.
  process_interval_seconds: 1.0
  # A bed/sofa/table occupancy change must hold for this many consecutive
  # frames before it's confirmed as a real *-IN/*-OUT event - filters out
  # single-frame detector flicker (bbox jittering across a region edge).
  # At process_interval_seconds=1.0 this means ~4s to confirm a change.
  zone_debounce_frames: 4

door:
  # Measured 2026-09-05 from the door region in config/regions.yaml, using
  # the temporary (non-final) camera position — RE-CALIBRATE once the camera
  # is mounted at its real location (lighting/distance/angle all affect
  # this), following the procedure in models/README.md.
  # NOTE: measured before the camera.py R/B channel-swap fix (see SPEC.md);
  # the grayscale conversion these are derived from may shift slightly now
  # that colors are correct — re-verify next time you're calibrating anyway.
  closed_edge_density: 0.078
  open_edge_density: 2.653

# Per-state max duration before an ANOMALY alert fires. null = no timeout
# (BED has none, since a long sleep is expected).
state_timeouts_seconds:
  OTHER: 180 # 3 minutes
  RESTROOM: 600 # 10 minutes
  SOFA: 3600 # 1 hour
  TABLE: 3600 # 1 hour
  BED: null

notifier:
  snapshot_path: /tmp/alert.jpg
  # Optional: base URL where snapshot_path's filename is reachable over HTTPS,
  # e.g. "https://your-host/snapshots". The LINE Messaging API requires a
  # public URL for image messages (unlike the old, now-retired LINE Notify
  # service, which accepted direct uploads). Leave null/unset to send
  # text-only alerts. Can also be set via the SNAPSHOT_PUBLIC_URL_BASE env var.
  snapshot_public_url_base: null

debug:
  # For testing/tuning region calibration: saves a snapshot on every *-IN/*-OUT
  # event, named "<YYMMDDHHMMSS>_<EVENT>.jpg". Set to null to disable.
  event_capture_dir: event_captures
